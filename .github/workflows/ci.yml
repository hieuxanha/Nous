name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: fe/dist/fe
          retention-days: 7

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: be

    # BeApplicationTests starts the whole app, so it needs a real database.
    # This MySQL exists only for the duration of the job.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: nous
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Throwaway CI values. They override application.properties, so CI never
    # uses your real credentials.
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/nous
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_only_password
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: be/pom.xml

      - name: Run tests and build jar
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: be/target/*.jar
          retention-days: 7
